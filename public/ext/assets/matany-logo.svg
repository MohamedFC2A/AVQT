<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Pitch Black / Obsidian Deep Background -->
    <radialGradient id="matanyChassis" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="55%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Diamond Brilliant White Gradient (Left Wing) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Liquid Platinum Metallic Gradient (Right Wing) -->
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Center Apex Singularity Gradient -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- Hairline Platinum Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Luxury Frosted Squircle Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#matanyChassis)" stroke="url(#rimGrad)" stroke-width="1.75" />
  
  <!-- Subtle Internal Glow Rim -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />

  <!-- Bold, Iconic Geometric 'M' Emblem -->
  <g>
    <!-- Left Ascending Monolith Column -->
    <polygon points="26,94 42,94 42,32 26,32" fill="url(#facetLeft)" />

    <!-- Right Ascending Monolith Column -->
    <polygon points="86,94 102,94 102,32 86,32" fill="url(#facetRight)" />

    <!-- Left Angular Chevron -->
    <polygon points="42,32 58,32 72,70 56,70" fill="url(#facetLeft)" />

    <!-- Right Angular Chevron -->
    <polygon points="86,32 70,32 56,70 72,70" fill="url(#facetRight)" />

    <!-- Central Floating Diamond Crystal -->
    <polygon points="64,44 72,56 64,68 56,56" fill="url(#facetCenter)" opacity="0.95" />
  </g>

  <!-- Micro Alignment Accents -->
  <circle cx="104" cy="24" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="24" cy="104" r="2.5" fill="#ffffff" opacity="0.35" />
</svg>
