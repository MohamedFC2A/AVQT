<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <base href="/1/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e7dar.com - شاشة عرض كود الحضور | Matany Group x FUE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #B91C1C;
      --neo-black: #121212;
      --neo-white: #FFFFFF;
      --neo-bg: #F8FAFC;
      --emerald: #059669;
      --border-main: 2.5px solid var(--neo-black);
      --shadow-main: 4px 4px 0px var(--neo-black);
      --shadow-lg: 6px 6px 0px var(--neo-black);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--neo-bg);
      color: var(--neo-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
      direction: rtl;
    }

    /* TOP HEADER */
    .presenter-header {
      background: var(--neo-white);
      border: var(--border-main);
      box-shadow: var(--shadow-main);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box {
      width: 140px;
      height: 48px;
      background: var(--neo-white);
      border: 2px solid var(--neo-black);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 10px;
      box-shadow: 2px 2px 0px var(--neo-black);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* MAIN STAGE */
    .presenter-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .stage-card {
      background: var(--neo-white);
      border: var(--border-main);
      box-shadow: var(--shadow-lg);
      border-radius: 16px;
      padding: 28px;
      max-width: 840px;
      width: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 32px;
      align-items: center;
    }

    /* QR BOX */
    .qr-large-frame {
      position: relative;
      width: 340px;
      height: 340px;
      background: var(--neo-white);
      border: var(--border-main);
      box-shadow: var(--shadow-main);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin: 0 auto;
    }

    .qr-center-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #FFFFFF;
      border: 2.5px solid var(--neo-black);
      box-shadow: 3px 3px 0px var(--neo-black);
      border-radius: 10px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      min-width: 72px;
      height: 48px;
    }

    .qr-badge-inner {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qr-badge-pulse {
      width: 10px;
      height: 10px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35);
      animation: pulse-ring 1.5s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .qr-badge-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .qr-badge-num {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--neo-black);
      font-family: monospace;
    }

    .qr-badge-lbl {
      font-size: 0.62rem;
      font-weight: 800;
      color: #059669;
      margin-top: 1px;
    }

    #presenterQrCanvas {
      width: 320px !important;
      height: 320px !important;
    }

    /* DETAILS COL */
    .details-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-block {
      background: #F8FAFC;
      border: 2px solid var(--neo-black);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: var(--shadow-main);
    }

    .info-lbl {
      display: block;
      font-size: 0.76rem;
      font-weight: 800;
      color: #475569;
      margin-bottom: 4px;
    }

    .digits-huge {
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--primary-red);
      line-height: 1.1;
    }

    .timer-hero-box {
      background: #FEF2F2;
      border: 2px solid var(--primary-red);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 3px 3px 0px var(--primary-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #7F1D1D;
    }

    .timer-digits {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary-red);
    }

    .presenter-actions {
      display: flex;
      margin-top: 10px;
    }

    .neo-btn {
      flex: 1;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 8px;
      border: var(--border-main);
      box-shadow: var(--shadow-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease;
      user-select: none;
    }

    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--neo-black);
    }

    .btn-close {
      background: var(--neo-black);
      color: var(--neo-white);
    }

    .btn-close:hover {
      background: #2D3748;
    }

    /* FOOTER */
    .presenter-footer {
      text-align: center;
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748B;
    }

    @media (max-width: 820px) {
      .stage-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- CLEAN TOPBAR (ZERO EXTRAS) -->
  <header class="presenter-header">
    <div class="brand-wrap">
      <div class="logo-box">
        <img src="/1/ehdar-logo-full.svg" alt="e7dar Logo">
      </div>
    </div>
  </header>

  <!-- MAIN STAGE -->
  <main class="presenter-main">
    <div class="stage-card">
      <!-- QR Big Frame with Smart Center Attendee Counter -->
      <div class="qr-large-frame">
        <canvas id="presenterQrCanvas" width="320" height="320"></canvas>
        <div class="qr-center-badge" id="qrCenterBadge" title="عدد الطلاب الحاضرين الآن">
          <div class="qr-badge-inner">
            <span class="qr-badge-pulse"></span>
            <div class="qr-badge-stat">
              <span class="qr-badge-num" id="qrAttendeeCount">0</span>
              <span class="qr-badge-lbl">حاضر</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Details -->
      <div class="details-col">
        <!-- 8-Digit Code -->
        <div class="info-block">
          <span class="info-lbl">رمز الحضور اليدوي المؤقت:</span>
          <div class="digits-huge" id="numericCodeDisplay">--------</div>
        </div>

        <!-- 3-Minute Countdown -->
        <div class="timer-hero-box">
          <div class="timer-title">
            <span>المهلة المتبقية للجلسة:</span>
            <small style="display:block; font-size:0.7rem; color:#991B1B;">إغلاق الشاشة وحفظ الكشف تلقائياً عند انتهاء الوقت</small>
          </div>
          <div class="timer-digits" id="timerDisplay">03:00</div>
        </div>

        <!-- Action Buttons -->
        <div class="presenter-actions">
          <button id="btnPresenterCloseOnly" class="neo-btn btn-close">
            إغلاق شاشة البث
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="presenter-footer">
    <span>نظام رصد الحضور الذكي AVQR • تطوير مجموعة مطعني (Matany Group) بالتعاون مع جامعة المستقبل في مصر (FUE)</span>
  </footer>

  <script src="/1/qrcode.min.js"></script>
  <script src="/1/presenter.js"></script>
</body>
</html>
